# Alembic configuration for the habit tracker database.
#
# There is deliberately no sqlalchemy.url here. migrations/env.py builds the
# connection URL from the same DB_* environment variables the service reads, so
# credentials never live in a committed file.

[alembic]
script_location = %(here)s/migrations

# Put the backend directory on sys.path so env.py can import habit_tracker.
prepend_sys_path = .
path_separator = os

# Logging for the alembic command itself. The service configures its own
# logging in habit_tracker.main; this only applies when running migrations.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
